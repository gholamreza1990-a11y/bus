<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سامانه موقعیت اتوبوس</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        .panel {
            position: absolute;
            z-index: 1000;
            top: 15px;
            right: 15px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.25);
            width: 270px;
        }

        .panel h3 {
            margin-top: 0;
            margin-bottom: 12px;
        }

        .info-row {
            margin-bottom: 10px;
            line-height: 1.8;
        }

        .location-button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            background: #1976d2;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .location-button:active {
            background: #125aa0;
        }

        #locationStatus {
            margin-top: 10px;
            font-size: 13px;
            line-height: 1.7;
        }

        .bus-icon {
            background: #1976d2;
            color: white;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            border: 3px solid white;
            box-shadow: 0 1px 6px rgba(0,0,0,0.4);
        }

        .station-icon {
            background: #e53935;
            color: white;
            border-radius: 50%;
            width: 27px;
            height: 27px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
            font-size: 13px;
            font-weight: bold;
        }

        .station-popup {
            text-align: right;
            direction: rtl;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<div class="panel">

    <h3>🚌 سامانه اتوبوس</h3>

    <div class="info-row">
        وضعیت اتوبوس:
        <strong id="status">در حال حرکت</strong>
    </div>

    <div class="info-row">
        ایستگاه بعدی:
        <strong id="nextStation">ایستگاه ۱</strong>
    </div>

    <div class="info-row">
        زمان تقریبی:
        <strong id="arrivalTime">در حال محاسبه...</strong>
    </div>

    <button
        class="location-button"
        onclick="getMyLocation()"
    >
        📍 موقعیت من
    </button>

    <div id="locationStatus">
        برای نمایش موقعیت، روی دکمه بالا بزنید.
    </div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ==========================================
// ساخت نقشه
// ==========================================

const map = L.map('map').setView(
    [35.7219, 51.3347],
    14
);


// ==========================================
// نقشه OpenStreetMap
// ==========================================

L.tileLayer(
    'https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png',
    {
        maxZoom: 20,
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);


// ==========================================
// مسیر اتوبوس
// ==========================================

const busRoute = [

    [35.7219, 51.3347],
    [35.7230, 51.3380],
    [35.7245, 51.3410],
    [35.7260, 51.3440],
    [35.7280, 51.3470],
    [35.7300, 51.3500],
    [35.7320, 51.3530]

];


// ==========================================
// رسم مسیر
// ==========================================

const routeLine = L.polyline(
    busRoute,
    {
        color: 'blue',
        weight: 6
    }
).addTo(map);


// ==========================================
// ایستگاه‌ها
// ==========================================

const stations = [

    {
        name: "ایستگاه ۱",
        position: [35.7219, 51.3347]
    },

    {
        name: "ایستگاه ۲",
        position: [35.7245, 51.3410]
    },

    {
        name: "ایستگاه ۳",
        position: [35.7280, 51.3470]
    },

    {
        name: "ایستگاه ۴",
        position: [35.7320, 51.3530]
    }

];


const stationIcon = L.divIcon({

    className: '',

    html:
        '<div class="station-icon">🚏</div>',

    iconSize: [27, 27],

    iconAnchor: [13, 13]

});


// ==========================================
// اضافه کردن ایستگاه‌ها
// ==========================================

stations.forEach(function(station, index) {

    const marker = L.marker(
        station.position,
        {
            icon: stationIcon
        }
    ).addTo(map);

    marker.bindPopup(

        '<div class="station-popup">' +

        '<b>' + station.name + '</b>' +

        '<br>' +

        '🚌 وضعیت: فعال' +

        '<br>' +

        '👆 برای مشاهده زمان رسیدن اتوبوس کلیک کنید' +

        '</div>'

    );

    marker.on('click', function() {

        calculateArrival(index);

    });

});


// ==========================================
// آیکون اتوبوس
// ==========================================

const busIcon = L.divIcon({

    className: '',

    html:
        '<div class="bus-icon">🚌</div>',

    iconSize: [38, 38],

    iconAnchor: [19, 19]

});


let busMarker = L.marker(

    busRoute[0],

    {
        icon: busIcon
    }

).addTo(map);


// ==========================================
// وضعیت حرکت اتوبوس
// ==========================================

let currentPoint = 0;

let nextStationIndex = 1;


// ==========================================
// حرکت نرم اتوبوس
// ==========================================

function moveBus() {

    currentPoint++;

    if (currentPoint >= busRoute.length) {

        currentPoint = 0;

    }


    busMarker.setLatLng(

        busRoute[currentPoint]

    );


    updateBusInformation();

}


// ==========================================
// اطلاعات اتوبوس
// ==========================================

function updateBusInformation() {

    if (currentPoint < 2) {

        nextStationIndex = 1;

    }

    else if (currentPoint < 4) {

        nextStationIndex = 2;

    }

    else {

        nextStationIndex = 3;

    }


    document.getElementById(
        "nextStation"
    ).innerText =

        stations[nextStationIndex].name;


    calculateArrival(nextStationIndex);

}


// ==========================================
// محاسبه زمان تقریبی رسیدن
// ==========================================

function calculateArrival(stationIndex) {

    let stationPosition =
        stations[stationIndex].position;


    let busPosition =
        busMarker.getLatLng();


    let distance =
        busPosition.distanceTo(

            L.latLng(stationPosition)

        );


    let distanceKm =
        distance / 1000;


    // سرعت فرضی اتوبوس: 25 کیلومتر بر ساعت

    let speedKmH = 25;


    let hours =
        distanceKm / speedKmH;


    let minutes =
        Math.max(
            1,
            Math.ceil(hours * 60)
        );


    document.getElementById(
        "arrivalTime"
    ).innerText =

        minutes + " دقیقه";


    document.getElementById(
        "nextStation"
    ).innerText =

        stations[stationIndex].name;

}


// ==========================================
// حرکت اتوبوس هر ۵ ثانیه
// ==========================================

setInterval(

    moveBus,

    5000

);


// ==========================================
// موقعیت کاربر
// ==========================================

let userMarker = null;


function getMyLocation() {

    const status =
        document.getElementById(
            "locationStatus"
        );


    if (!navigator.geolocation) {

        status.innerText =
            "❌ مرورگر شما از موقعیت مکانی پشتیبانی نمی‌کند.";

        return;

    }


    status.innerText =
        "⏳ در حال دریافت موقعیت شما...";


    navigator.geolocation.getCurrentPosition(

        function(position) {

            const lat =
                position.coords.latitude;


            const lng =
                position.coords.longitude;


            const userPosition =
                [lat, lng];


            if (userMarker === null) {

                userMarker =
                    L.circleMarker(

                        userPosition,

                        {

                            radius: 9,

                            color: "white",

                            weight: 3,

                            fillColor: "#1976d2",

                            fillOpacity: 1

                        }

                    )
                    .addTo(map)
                    .bindPopup(
                        "📍 موقعیت من"
                    );

            }

            else {

                userMarker.setLatLng(
                    userPosition
                );

            }


            map.setView(

                userPosition,

                16

            );


            userMarker.openPopup();


            status.innerText =
                "✅ موقعیت شما پیدا شد.";

        },


        function(error) {

            if (error.code === 1) {

                status.innerText =
                    "❌ اجازه دسترسی به موقعیت مکانی داده نشده است.";

            }

            else if (error.code === 2) {

                status.innerText =
                    "❌ موقعیت شما پیدا نشد. GPS را بررسی کنید.";

            }

            else if (error.code === 3) {

                status.innerText =
                    "❌ دریافت موقعیت طول کشید. دوباره تلاش کنید.";

            }

            else {

                status.innerText =
                    "❌ خطا در دریافت موقعیت مکانی.";

            }

        },


        {

            enableHighAccuracy: true,

            maximumAge: 0,

            timeout: 15000

        }

    );

}


// ==========================================
// تنظیم نقشه روی مسیر
// ==========================================

map.fitBounds(

    routeLine.getBounds(),

    {

        padding: [30, 30]

    }

);


// ==========================================
// اجرای اولیه اطلاعات
// ==========================================

updateBusInformation();

</script>

</body>
</html>
